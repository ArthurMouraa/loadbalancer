
events {}

http {
    upstream servidores_java {
        # Nome dos serviços definidos no Docker Compose
        server app-01:8080;
        server app-02:8080;
        server app-03:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://servidores_java;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}