
version: '3.8'

services:
  app-01:
    build: .
    image: loadbalancer-demo
    environment:
      INSTANCE_ID: app-01
    restart: unless-stopped

  app-02:
    image: loadbalancer-demo
    environment:
      INSTANCE_ID: app-02
    restart: unless-stopped

  app-03:
    image: loadbalancer-demo
    environment:
      INSTANCE_ID: app-03
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-01
      - app-02
      - app-03
    restart: unless-stopped
